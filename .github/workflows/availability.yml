name: Production availability
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: production-availability
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'edencohen533-create/quizflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test monitoring behavior
        run: node --test tests/monitor.test.mjs
      - name: Probe production and manage incident
        run: node scripts/monitor-production.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
